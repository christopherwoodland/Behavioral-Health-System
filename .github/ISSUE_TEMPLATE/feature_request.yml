name: Feature request
description: Propose an improvement to MindBridge
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operational problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the desired behavior without including sensitive or patient data.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: impact
    attributes:
      label: Primary impact
      options:
        - Clinical workflow or presentation
        - Privacy or security
        - Accessibility
        - Backend or API
        - Infrastructure or operations
        - Developer experience
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: This request contains no credentials, patient data, or protected health information.
          required: true
