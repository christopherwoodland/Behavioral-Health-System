name: Build and Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BehavioralHealthSystem.sln

      - name: Build
        run: dotnet build BehavioralHealthSystem.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test BehavioralHealthSystem.Tests/BehavioralHealthSystem.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: BehavioralHealthSystem.Tests/TestResults/*.trx
          if-no-files-found: ignore

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BehavioralHealthSystem.Web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BehavioralHealthSystem.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
